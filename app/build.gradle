plugins { id 'com.android.application' }

android {
    namespace 'com.mughalai.studio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.mughalai.studio'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '2.3-ai-storyboard'
    }
}

dependencies {
    implementation 'com.google.android.filament:filament-android:1.56.0'
    implementation 'com.google.android.filament:gltfio-android:1.56.0'
    implementation 'com.google.android.filament:filament-utils-android:1.56.0'
}
